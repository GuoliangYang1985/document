project:
  type: book
  # 渲染时工作目录 = 项目根，使 chapters/ 下 %run scripts/... 可解析
  execute-dir: project

book:
  title: "测量的边界"
  subtitle: "演化速率耦合场论"
  author: "杨国梁"
  # HTML 版页面右上角提供 PDF 下载按钮
  downloads: pdf
  chapters:
    - index.qmd
    - chapters/symmetric-twins.qmd
    - chapters/transform-derivation.qmd
    - chapters/maxwell-equations.qmd
    - chapters/galilean-electrodynamics.qmd
    - chapters/two-source-field.qmd
    - chapters/flat-space-gravity.qmd
    - chapters/clock-coupling.qmd
    - chapters/references.qmd

csl: csl/china-national-standard-gb-t-7714-2015-numeric.csl
bibliography: chapters/references.bib

lang: zh-CN

# 定理类环境的中文标签。Quarto 只识别内建键（thm/lem/cor/prp/cnj/def/…），
# 其中无「公理」键，故约定：cnj 作「公理」，prp 作「命题」。
# 这样 @cnj-* / @prp-* / @def-* / @thm-* / @lem-* / @cor-* 在 PDF 与 HTML 中
# 分别渲染为「公理 N」「命题 N」「定义 N」「定理 N」「引理 N」「推论 N」。
language:
  crossref-cnj-title: "公理"
  crossref-prp-title: "命题"
  crossref-def-title: "定义"
  crossref-thm-title: "定理"
  crossref-lem-title: "引理"
  crossref-cor-title: "推论"

author:
  - name: "杨国梁"
    affiliation: "山东 济南"
    email: "guoliang-yang@hotmail.com"
subject: "理论物理 · 相对论"
keywords:
  - 相对论
  - 麦克斯韦方程组
  - 洛伦兹变换
  - 协变性
  - 电磁场张量

format:
  pdf:
    pdf-engine: xelatex
    keep-tex: true
    link-citations: true
    documentclass: ctexbook
    classoption:
      - "UTF8"
      - "12pt"
      - "oneside"
      - "openany"
    papersize: a4
    linestretch: 1.5
    toc: true
    toc-depth: 3
    secnumdepth: 3
    number-sections: true
    lot: true
    lof: false
    colorlinks: true
    linkcolor: "blue!50!black"
    citecolor: "blue!50!black"
    urlcolor: "blue!50!black"
    include-in-header:
      - preamble.tex

    include-before-body:
      - before-body.tex

  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    # KaTeX 渲染数学公式（快速且离线友好）
    html-math-method: katex
    link-citations: true
    # 图片自适应缩放
    fig-responsive: true

